[package]
name = "cordis-di-loader"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
description = "Module loader for cordis-di — Entry, Group, ModuleLoader"
license = "MIT"
homepage = "https://github.com/Ricardo-M-L/cordis-di"
repository = "https://github.com/Ricardo-M-L/cordis-di"

[dependencies]
cordis-di-core = { version = "0.1.0", path = "../cordis-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
