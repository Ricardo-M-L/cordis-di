[package]
name = "cordis-di-timer"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
description = "Async timer service for cordis-di — timeout, interval, throttle, debounce"
license = "MIT"
homepage = "https://github.com/Ricardo-M-L/cordis-di"
repository = "https://github.com/Ricardo-M-L/cordis-di"

[dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "time", "macros"] }
futures = "0.3"
